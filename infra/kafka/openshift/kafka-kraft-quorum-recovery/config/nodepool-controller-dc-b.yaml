apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller-dc-b
  labels:
    strimzi.io/cluster: multidc
    datacenter: dc-b
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        kraftMetadata: shared
        deleteClaim: false
  template:
    pod:
      metadata:
        labels:
          datacenter: dc-b
        annotations:
          # Simulate datacenter B
          topology.kubernetes.io/zone: dc-b
