apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my 
spec:
  kafka:
    version: "3.9.0"
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      log.roll.ms: 300000
    storage:
      type: persistent-claim
      size: 200M 
      deleteClaim: true
    listeners:
      - name: plain
        port: 9092
        type: internal 
        tls: false
      - name: mytls 
        port: 9094
        type: route
        tls: true
    replicas: 3
  entityOperator:
    topicOperator: {}
    userOperator: {}
  zookeeper:
    storage:
      type: persistent-claim
      size: 100M 
    replicas: 3
  clusterCa:
    renewalDays: 1
    validityDays: 10
    generateCertificateAuthority: true

