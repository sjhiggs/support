# HAProxy configuration for Docker deployment with Kroxylicious
#
# In containers, each service has its own network namespace, so no port conflicts.
# ALL client traffic flows through HAProxy:
#
# Client (localhost) → HAProxy (container) → Kroxylicious (container) → Kafka (containers)

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Stats page
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s

# Bootstrap frontend
frontend kafka_bootstrap_front
    bind *:9095
    mode tcp
    default_backend kafka_bootstrap_back

backend kafka_bootstrap_back
    mode tcp
    server kroxy kroxylicious:9095 check

# Broker 0 frontend
frontend kafka_broker0_front
    bind *:9096
    mode tcp
    default_backend kafka_broker0_back

backend kafka_broker0_back
    mode tcp
    server kroxy0 kroxylicious:9096 check

# Broker 1 frontend
frontend kafka_broker1_front
    bind *:9097
    mode tcp
    default_backend kafka_broker1_back

backend kafka_broker1_back
    mode tcp
    server kroxy1 kroxylicious:9097 check

# Broker 2 frontend
frontend kafka_broker2_front
    bind *:9098
    mode tcp
    default_backend kafka_broker2_back

backend kafka_broker2_back
    mode tcp
    server kroxy2 kroxylicious:9098 check
