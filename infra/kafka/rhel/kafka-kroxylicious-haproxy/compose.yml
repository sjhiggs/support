# Podman/Docker Compose file for Kafka + Kroxylicious + HAProxy
#
# Usage:
#   podman-compose up -d    (recommended for RHEL/Fedora)
#   docker-compose up -d    (alternative)
#
# This file works with both Podman and Docker

services:
  # Kafka Node 0
  kafka-0:
    image: apache/kafka:latest
    container_name: kafka-0
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka-0:19092,PLAINTEXT://kafka-0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:19092,1@kafka-1:19093,2@kafka-2:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      CLUSTER_ID: q6Wklx3BQF6RxKTRElZYUA
    volumes:
      - kafka-0-data:/var/lib/kafka/data

  # Kafka Node 1
  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka-1:19093,PLAINTEXT://kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:19092,1@kafka-1:19093,2@kafka-2:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      CLUSTER_ID: q6Wklx3BQF6RxKTRElZYUA
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  # Kafka Node 2
  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka-2:19094,PLAINTEXT://kafka-2:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:19092,1@kafka-1:19093,2@kafka-2:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      CLUSTER_ID: q6Wklx3BQF6RxKTRElZYUA
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  # Kroxylicious Proxy
  kroxylicious:
    image: quay.io/kroxylicious/kroxylicious:0.23.0
    container_name: kroxylicious
    command: ["--config=/opt/kroxylicious/config/config.yaml"]
    # No ports exposed - only accessible via HAProxy within container network
    volumes:
      - /redhat/github/support/infra/kafka/rhel/kraft-kroxylicious/config/kroxylicious/kroxylicious.yaml:/opt/kroxylicious/config/config.yaml:ro,Z
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2

  # HAProxy Load Balancer
  haproxy:
    image: docker.io/library/haproxy:latest
    container_name: haproxy
    ports:
      - "9095:9095"    # Bootstrap port
      - "9096:9096"    # Broker 0 port
      - "9097:9097"    # Broker 1 port
      - "9098:9098"    # Broker 2 port
      - "8404:8404"    # Stats UI
    volumes:
      - /redhat/github/support/infra/kafka/rhel/kraft-kroxylicious/config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,Z
    depends_on:
      - kroxylicious

volumes:
  kafka-0-data:
  kafka-1-data:
  kafka-2-data:
