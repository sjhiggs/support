# Kafka Connect Distributed Mode Configuration
# CRITICAL: Worker must connect to TARGET cluster (kafka-b-*) to prevent feedback loops

# Worker coordination
bootstrap.servers=kafka-b-0:9092,kafka-b-1:9092,kafka-b-2:9092
group.id=mm2-cluster

# Internal topics (store offsets, configs, status on target cluster)
offset.storage.topic=mm2-offsets
config.storage.topic=mm2-configs
status.storage.topic=mm2-status

# Converters (MM2 requires ByteArray, not default JSON)
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter
