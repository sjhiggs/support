# Podman/Docker Compose file for Kafka + Debezium (Distributed) + Oracle
#
# Usage:
#   podman-compose up -d    (recommended for RHEL/Fedora)
#   docker-compose up -d    (alternative)
#
# This file works with both Podman and Docker

services:
  # Kafka Node 0
  kafka-0:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: kafka-0
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka-0:19092,PLAINTEXT://kafka-0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:19092,1@kafka-1:19093,2@kafka-2:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      CLUSTER_ID: q6Wklx3BQF6RxKTRElZYUA
    volumes:
      - kafka-0-data:/var/lib/kafka/data

  # Kafka Node 1
  kafka-1:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka-1:19093,PLAINTEXT://kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:19092,1@kafka-1:19093,2@kafka-2:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      CLUSTER_ID: q6Wklx3BQF6RxKTRElZYUA
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  # Kafka Node 2
  kafka-2:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka-2:19094,PLAINTEXT://kafka-2:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:19092,1@kafka-1:19093,2@kafka-2:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      CLUSTER_ID: q6Wklx3BQF6RxKTRElZYUA
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  # Oracle Database
  oracle:
    image: gvenzl/oracle-xe:${ORACLE_VERSION:-21.3.0-faststart}
    container_name: oracle
    hostname: oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: debezium
      APP_USER_PASSWORD: dbz
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Debezium Connect Worker 1 (Distributed Mode)
  debezium-1:
    build:
      context: ./docker
      args:
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION:-3.0}
        ORACLE_JDBC_VERSION: ${ORACLE_JDBC_VERSION:-21.6.0.0}
    image: debezium-oracle-connect:${DEBEZIUM_VERSION:-3.0}
    container_name: debezium-1
    hostname: debezium-1
    ports:
      - "8083:8083"
      - "5005:5005"
    depends_on:
      kafka-0:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      oracle:
        condition: service_healthy
    environment:
      # Distributed mode configuration
      BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9093,kafka-2:9094
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      # Replication factors for internal topics
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      # Oracle specific
      LD_LIBRARY_PATH: /instant_client
      # Debug settings
      KAFKA_DEBUG: "true"
      DEBUG_SUSPEND_FLAG: "n"
      JAVA_DEBUG_PORT: "0.0.0.0:5005"

  # Debezium Connect Worker 2 (Distributed Mode)
  debezium-2:
    build:
      context: ./docker
      args:
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION:-3.0}
        ORACLE_JDBC_VERSION: ${ORACLE_JDBC_VERSION:-21.6.0.0}
    image: debezium-oracle-connect:${DEBEZIUM_VERSION:-3.0}
    container_name: debezium-2
    hostname: debezium-2
    ports:
      - "8084:8083"
      - "5006:5005"
    depends_on:
      kafka-0:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      oracle:
        condition: service_healthy
    environment:
      # Distributed mode configuration (same group as debezium-1)
      BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9093,kafka-2:9094
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      # Replication factors for internal topics
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      # Oracle specific
      LD_LIBRARY_PATH: /instant_client
      # Debug settings
      KAFKA_DEBUG: "true"
      DEBUG_SUSPEND_FLAG: "n"
      JAVA_DEBUG_PORT: "0.0.0.0:5005"

volumes:
  kafka-0-data:
  kafka-1-data:
  kafka-2-data:
  oracle-data:
